
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AtomQuest Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0f172a; color: white; }
        .container { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
        header { text-align: center; padding: 60px 20px; background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        header h1 { font-size: 48px; margin-bottom: 16px; }
        .card { background: #1e293b; padding: 24px; border-radius: 12px; margin: 20px 0; }
        .btn { padding: 12px 24px; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <header>
        <h1>🚀 AtomQuest Portal</h1>
        <p>Your Awesome Solution for the Hackathon</p>
    </header>
    <div class="container">
        <div class="card">
            <h2>Welcome to the Portal</h2>
            <p>This is where you build your hackathon solution!</p>
        </div>
    </div>
</body>
</html>
